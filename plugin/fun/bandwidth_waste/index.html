{extend name="common/plugin_layout" /}
{block name="title"}{$plugin.title} - {:config_get('title')}{/block}
{block name="main"}
<style>
.stat {
    width: 100%;
    column-gap: 1rem;
    padding: 1rem 1.5rem;
}
.stat-title {
    white-space: nowrap;
    opacity: .6;
}
.stat-value {
    white-space: nowrap;
    grid-column-start: 1;
    font-size: 1.8rem;
    font-weight: 700;
    line-height: 2.5rem
}
</style>
<div class="container-xl" id="app">
<div class="col-sm-12 col-md-10 col-xl-8 center-block">
    <div class="card card-preview">
        <div class="card-inner mt-3">
            <div class="nya-title nk-ibx-action-item progress-rating">
                <span class="nk-menu-text font-weight-bold">让流量消失</span>
            </div>
            <div class="form-group">
                <label class="form-label">下载链接</label>
                <div class="form-control-wrap">
                    <select v-model="set.nodeurl" type="text" class="form-control">
					<optgroup label="运营商">
					    <option value="https://freeserver.migufun.com/resource/beta/video/system/20210924112351666.mp4" selected>
						咪咕视频</option>
						<option value="https://img.mcloud.139.com/material_prod/material_media/20221128/1669626861087.png">
						和彩云</option>
					</optgroup>
					<optgroup label="其他">
					    <option value="https://registry.npmmirror.com/aws-sdk/-/aws-sdk-2.1693.0.tgz">
						阿里云镜像</option>
						<option value="https://wwwstatic.vivo.com.cn/vivoportal/files/resource/funtouch/1651200648928/images/os2-jude-video.mp4">
						vivo</option>
						<option value="https://activity.hdslb.com/blackboard/static/20210604/4d40bc4f98f94fbc71c235832ce3efd4/hJEhL6jGOY.zip">
						上海灵羊</option>
					</optgroup>
					<optgroup label="全球[Global]">
						<option value="https://speed.cloudflare.com/__down?bytes=104857600">
						Cloudflare</option>
						<option value="https://unpkg.com/typescript@5.5.4/lib/typescript.js">
						unpkg</option>
						<option value="https://akamtrans-a.akamaihd.net/delivery/2023/08/30/brand-protector-2500k-00004.ts">
						Akamai</option>
					</optgroup>
                  </select>
                    <input type="text" v-model="set.input" placeholder="下载链接" class="form-control" autocomplete="off">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">线程（最高支持32，手机建议10以内）</label>
                <div class="form-control-wrap number-spinner-wrap">
                    <button class="btn btn-icon btn-outline-primary number-spinner-btn number-minus" @click="if(set.thread>1)set.thread--"><em class="icon ni ni-minus"></em></button>
                    <input type="number" class="form-control number-spinner" min="1" max="32" v-model="set.thread">
                    <button class="btn btn-icon btn-outline-primary number-spinner-btn number-plus" @click="if(set.thread<32)set.thread++"><em class="icon ni ni-plus"></em></button>
                </div>
            </div>
            <div class="form-group">
                <div class="preview-block">
                    <div class="custom-control custom-switch">
                        <input type="checkbox" class="custom-control-input" v-model="set.infinite" id="customSwitch2">
                        <label class="custom-control-label" for="customSwitch2">无限循环</label>
                    </div>
                </div>
            </div>
            <button class="btn btn-dim btn-outline-secondary btn-block card-link" @click="run">
                {{set.status?'停止':'开始'}}
            </button>
            <div class="row mt-4">
                <div class="col-sm-12 col-md-4 border stat">
                    <div class="text-dark"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="h-15 w-15 float-right pt-3"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg></div>
                    <div class="stat-title">已消失的流量</div>
                    <div class="stat-value">{{changeFilesize(waste)}}</div>
                </div>
                <div class="col-sm-12 col-md-4 border stat">
                    <div class="text-info"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="h-15 w-15 float-right pt-3"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg></div>
                    <div class="stat-title">每秒实时流量</div>
                    <div class="stat-value text-info">{{speed}}</div>
                </div>
                <div class="col-sm-12 col-md-4 border stat">
                    <div class="text-dark"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="h-15 w-15 float-right pt-3"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>
                    <div class="stat-title">运行时长</div>
                    <div class="stat-value">{{secToTime(spend)}}</div>
                </div>
            </div>
        </div>
    </div>
    <div class="card card-preview">
        <div class="card-inner">
            <h6><em class="icon ni ni-info"></em> 工具说明</h6>
            <div class="accordion-inner">
                <p>此工具可以以浪费的形式消耗你的流量</p>
                <p>注意：无法请求跨域链接</p>
            </div>
        </div>
    </div>
</div>
</div>
{/block}
{block name="script"}
<script src="{$cdn_cdnjs}vue/2.6.14/vue.min.js"></script>
<script>
new Vue({
    el: '#app',
    data: {
        set: {
            nodeurl: 'https://freeserver.migufun.com/resource/beta/video/system/20210924112351666.mp4',
            input: '',
            infinite: true,
            status: false,
            thread: 4,
        },
        speed: '0.00 B/s',
        spend: 0,
        waste: 0,
        timer: null
    },
    watch: {
        async 'set.status'(newVal) {
            if (newVal) {
                // 非响应式内部状态（Vue 2 不代理 _ 前缀属性），避免每个数据块都触发重渲染
                this._bytes = this._bytes || 0
                this._lastBytes = this._bytes
                this._spendBase = this.spend
                this._startTime = Date.now()
                this._controllers = []
                this._stopped = false
                this.timer = setInterval(() => {
                    this.spend = this._spendBase + Math.floor((Date.now() - this._startTime) / 1000)
                    this.waste = this._bytes
                    this.speed = this.changeDownloadSpeed(this._bytes - this._lastBytes)
                    this._lastBytes = this._bytes
                }, 1000)
                do {
                    await this.runBatch()
                } while (this.set.status && this.set.infinite)
            } else {
                this.stop()
            }
        },
        'set.nodeurl'(newVal) {
            this.set.input = newVal
        }
    },
    mounted() {
        this.set.input = this.set.nodeurl
    },
    methods: {
        run() {
            if (this.set.status) {
                this._stopped = true
            } else if (!this.set.input.trim()) {
                layer.msg('请输入下载链接', {icon: 2})
                return
            }
            this.set.status = !this.set.status
        },
        stop() {
            clearInterval(this.timer)
            this._stopped = true
            this._controllers.forEach(ctrl => ctrl.abort())
        },
        runBatch() {
            const threads = Math.min(32, Math.max(1, parseInt(this.set.thread) || 1))
            let task = []
            for (let i = 0; i < threads; i++) {
                task.push(this.download())
            }
            return Promise.all(task)
        },
        // 流式下载：每个数据块读完即丢弃，内存占用与文件大小无关；20 秒无数据视为停滞
        download() {
            const ctrl = new AbortController()
            let watchdog = null
            this._controllers.push(ctrl)
            return fetch(this.set.input, {
                cache: 'no-store',
                signal: ctrl.signal
            }).then(res => {
                if (!res.ok) throw new Error('HTTP ' + res.status)
                if (!res.body) throw new Error('当前浏览器不支持流式下载')
                const reader = res.body.getReader()
                const bump = () => {
                    clearTimeout(watchdog)
                    watchdog = setTimeout(() => ctrl.abort(), 20000)
                }
                const pump = async () => {
                    for (;;) {
                        const {done, value} = await reader.read()
                        if (done) return
                        this._bytes += value.length
                        bump()
                    }
                }
                bump()
                return pump()
            }).catch(e => {
                if (this._stopped) return
                if (this.set.status) {
                    const msg = e.name === 'AbortError' ? '连接停滞，已停止'
                        : (e instanceof TypeError ? '网络请求失败，已停止' : (e.message || '下载失败'))
                    layer.msg(msg, {icon: 2})
                    this.set.status = false
                }
            }).finally(() => {
                clearTimeout(watchdog)
                const i = this._controllers.indexOf(ctrl)
                if (i > -1) this._controllers.splice(i, 1)
            })
        },
        secToTime(s) {
            let t = '';
            if (s > -1) {
                let hour = Math.floor(s / 3600)
                let min = Math.floor(s / 60) % 60
                let sec = s % 60
                if (hour > 0) {
                    if (hour < 10) {
                        t += '0'
                    }
                    t += hour + "h"
                }
                if (hour > 0 || min > 0) {
                    if (min < 10) {
                        t += '0'
                    }
                    t += min + "m"
                }
                if (sec < 10) {
                    t += '0'
                }
                t += sec + 's'
            }
            return t
        },
        changeFilesize: (filesize) => {
            filesize = parseInt(filesize);
            let size = "";
            if (filesize === 0) {
                size = "0.00 B"
            } else if (filesize < 1024) { //小于1KB，则转化成B
                size = filesize.toFixed(2) + " B"
            } else if (filesize < 1024 * 1024) { //小于1MB，则转化成KB
                size = (filesize / 1024).toFixed(2) + " KB"
            } else if (filesize < 1024 * 1024 * 1024) { //小于1GB，则转化成MB
                size = (filesize / (1024 * 1024)).toFixed(2) + " MB"
            } else { //其他转化成GB
                size = (filesize / (1024 * 1024 * 1024)).toFixed(2) + " GB"
            }
            return size;
        },
        changeDownloadSpeed(bytes) {
            return this.changeFilesize(bytes).replace(/B$/, 'B/s')
        }
    },
})
</script>
{/block}
